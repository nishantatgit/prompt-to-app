name: vercel-source-spike
on:
  push:
    branches: [spike/vercel-source]
permissions:
  contents: write
jobs:
  spike:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run the check
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_TEAM_ID: ${{ secrets.VERCEL_TEAM_ID }}
        run: |
          pip install httpx >/dev/null
          python scripts/vercel_source_spike.py > spike-output.txt 2>&1 || echo "script exited with $?" >> spike-output.txt
          cat spike-output.txt
      - name: Save the output
        run: |
          git config user.name "github-actions"; git config user.email "actions@github.com"
          git fetch origin spike-results || true
          git checkout -B spike-results origin/spike-results 2>/dev/null || git checkout -B spike-results
          mkdir -p out && mv spike-output.txt "out/vercel-${GITHUB_SHA::7}.txt"
          git add out && git commit -m "chore: spike output ${GITHUB_SHA::7}" && git push -f origin spike-results
