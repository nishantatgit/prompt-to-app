name: Backend

# Runs the backend tests on every pull request and push to main that touches
# the backend. The tests use stubs and mocks only: no secrets, no model calls,
# and the database test skips itself without VYSKAR_TEST_DATABASE_URL.
on:
  pull_request:
    paths:
      - "backend/**"
      - ".github/workflows/backend.yml"
  push:
    branches: [main]
    paths:
      - "backend/**"
      - ".github/workflows/backend.yml"

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          cache-dependency-glob: backend/uv.lock
      - run: uv python install 3.14
      - run: uv sync --frozen
      - run: uv run --frozen pytest -q
