# fly.toml app configuration file generated for backend-satin-skylark-1693 on 2026-10-29T13:42:15+05:30
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = 'backend-satin-skylark-1693'
primary_region = 'sin'

[build]
[http_service]
  internal_port = 8000
  force_https = true
  auto_stop_machines = 'off'
  auto_start_machines = true
  min_machines_running = 1
  processes = ['app']

[[vm]]
  memory = '2gb'
  cpu_kind = 'shared'
  cpus = 2
# Everything Vyskar must keep across deploys lives here (DATA_DIR):
#   credits.db        bought build credits and Razorpay payments
#   trial-usage.json  free build counts, feedback bonuses, trial databases
#   feedback.db       feedback and waitlist emails (the /admin page)
#   push.db           Web Push subscriptions
#   screenshots/      photos of finished apps
# Deleting or recreating the volume loses all of it. Create the volume once
# before deploying this:
#   fly volumes create vyskar_data --region sin --size 1
[mounts]
  source = 'vyskar_data'
  destination = '/data'

[env]
  DATA_DIR = '/data'
