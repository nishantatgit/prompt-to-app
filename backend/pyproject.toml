[project]
name = "backend"
version = "0.1.0"
requires-python = ">=3.14"
dependencies = [
    "fastapi>=0.143.0",
    "langchain>=1.4.5",
    "langchain-anthropic>=1.7.6",
    "langchain-openai>=1.7.1",
    "langgraph>=1.2.15",
    "psycopg[binary]>=3.3.9",
    "pydantic-settings>=2.16.0",
    "pywebpush>=2.5.0",
    "uvicorn>=0.54.0",
]

[dependency-groups]
dev = [
    "pytest>=9.2.0",
    "ruff>=0.17.0",
    "watchfiles>=1.3.0",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
# Line length is left to `ruff format`; long strings and comments it can't
# wrap are fine.
ignore = ["E501"]

[tool.ruff.lint.flake8-bugbear]
# FastAPI's dependencies are meant to be written as argument defaults.
extend-immutable-calls = ["fastapi.Depends"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
