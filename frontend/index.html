    <style>
      /* The splash in the installed app, until React has drawn the first screen.
         Inline so it shows before the stylesheet loads. Hidden in a browser tab. */
      #splash { display: none; }
      @media (display-mode: standalone) {
        #splash {
          position: fixed; inset: 0; z-index: 100; display: flex; flex-direction: column;
          align-items: center; justify-content: center; gap: 28px; background: #3a0b49;
          transition: opacity 250ms ease-out;
        }
        #splash svg { width: 26vmin; max-width: 180px; height: auto; }
        #splash p { margin: 0; font: 700 clamp(28px, 7vmin, 52px)/1 'Unbounded', system-ui, sans-serif; color: #f1effa; }
        #splash.splash-hide { opacity: 0; }
      }
      @media (prefers-reduced-motion: reduce) { #splash { transition: none; } }
    </style>
